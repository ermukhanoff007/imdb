<p-dataview [value]="movies()">
  <ng-template>
    <div class="empty">No Films</div>
  </ng-template>

  <ng-template #list let-items>
    <div class="film-list">
      @for (movie of items; track movie.id) {
        <app-film-item [movie]="movie"></app-film-item>
      }
    </div>
  </ng-template>
</p-dataview>
